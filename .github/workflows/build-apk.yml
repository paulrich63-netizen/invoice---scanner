name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing platform files
        run: flutter create . --project-name invoice_scanner --org com.invoice.scanner --platforms=android

      - name: Fix compileSdk + add ProGuard rules for ML Kit
        run: |
          # Force compileSdk / targetSdk 35
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdk 35/' android/app/build.gradle || true

          # Create / overwrite ProGuard rules to keep ML Kit classes
          cat > android/app/proguard-rules.pro << 'EOF'
          # Keep Google ML Kit classes
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

          echo "ProGuard rules written"
          echo "=== compileSdk / targetSdk ==="
          grep -n "compileSdk\|targetSdk" android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

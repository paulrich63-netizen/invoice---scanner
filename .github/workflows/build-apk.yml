name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing platform files
        run: flutter create . --project-name invoice_scanner --org com.invoice.scanner --platforms=android

      - name: Force disable code shrinking (fix ML Kit R8 error)
        run: |
          # Handle both Groovy and Kotlin DSL build files
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle
            # Also force it in the release block if present
            sed -i '/release {/,/}/ s/minifyEnabled.*/minifyEnabled false/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/minifyEnabled = true/minifyEnabled = false/g' android/app/build.gradle.kts
          fi
          echo "=== Checking build.gradle content ==="
          grep -n -i "minify\|shrink" android/app/build.gradle* || echo "No minify lines found"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing platform files
        run: |
          flutter create . --project-name invoice_scanner --org com.invoice.scanner --platforms=android

      - name: Disable R8 minification (fix ML Kit missing classes)
        run: |
          sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle || true
          sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle.kts || true
          echo "Minification disabled"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

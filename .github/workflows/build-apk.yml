name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate missing platform files
        run: flutter create . --project-name invoice_scanner --org com.invoice.scanner --platforms=android

      - name: Fix Android build settings (SDK 35 + disable R8)
        run: |
          # Raise compileSdk and targetSdk to 35
          sed -i 's/compileSdk = 34/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 34/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdk = 34/targetSdk = 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdk 35/' android/app/build.gradle || true

          # Force disable minify and shrink in release
          python3 - <<'EOF'
          import re, pathlib
          path = pathlib.Path("android/app/build.gradle")
          if path.exists():
              text = path.read_text()
              # Disable minifyEnabled
              text = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', text)
              text = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', text)
              # Disable shrinkResources
              text = re.sub(r'shrinkResources\s+true', 'shrinkResources false', text)
              text = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', text)
              path.write_text(text)
              print("Updated build.gradle")
          else:
              print("build.gradle not found")
          EOF

          echo "=== Current minify / shrink settings ==="
          grep -n -i "minify\|shrink\|compileSdk\|targetSdk" android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
